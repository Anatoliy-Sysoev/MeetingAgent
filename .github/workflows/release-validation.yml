name: Release Validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-py312.txt
            requirements.txt
            requirements-transcription.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -c constraints-py312.txt pip
          python -m pip install -c constraints-py312.txt -r requirements-dev.txt

      - name: Validate release notes
        run: python scripts/45_validate_release_notes.py --version "${{ inputs.version }}"

      - name: Run full verification
        run: python scripts/46_ci_verify.py

      - name: Audit pinned dependency graph
        run: python scripts/47_dependency_audit.py
