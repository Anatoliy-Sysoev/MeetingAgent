name: Dependency Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-py312.txt
            requirements-dev.txt

      - name: Install audit tool from reviewed constraints
        run: |
          python -m pip install -c constraints-py312.txt pip
          python -m pip install -c constraints-py312.txt pip-audit

      - name: Audit pinned dependency graph
        run: python scripts/47_dependency_audit.py
