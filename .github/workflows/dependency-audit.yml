name: Dependency Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: audit (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            os: ubuntu-latest
            requirements: constraints-py312.txt
          - name: live-linux
            os: ubuntu-latest
            requirements: constraints-live-py312-linux.txt
          - name: live-windows
            os: windows-latest
            requirements: constraints-live-py312-windows.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints-py312.txt
            constraints-live-py312-linux.txt
            constraints-live-py312-windows.txt
            requirements-dev.txt
            requirements-live.txt
            requirements-live-lock-py312.in

      - name: Install audit tool from reviewed constraints
        run: |
          python -m pip install -c constraints-py312.txt pip
          python -m pip install -c constraints-py312.txt pip-audit

      - name: Audit pinned dependency graph
        run: python scripts/47_dependency_audit.py --requirements "${{ matrix.requirements }}"
