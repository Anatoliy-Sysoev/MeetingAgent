services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: meetingagent:local
    env_file:
      - path: .env
        required: false
    environment:
      MEETING_AGENT_CONFIG_PATH: /app/config.docker.yaml
      MEETINGAGENT_BIND_HOST: ${MEETINGAGENT_BIND_HOST:-127.0.0.1}
    ports:
      - "${MEETINGAGENT_BIND_HOST:-127.0.0.1}:${MEETINGAGENT_CORE_API_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./meetings:/app/meetings
      - ./config.docker.yaml:/app/config.docker.yaml:ro
    command: ["python", "scripts/meeting_agent_api.py", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - core

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meetingagent:local
    env_file:
      - path: .env
        required: false
    environment:
      MEETING_AGENT_CONFIG_PATH: /app/config.docker.yaml
      ASU_JUNE_BOT_ACTIVE_CORPUS: ${ASU_JUNE_BOT_ACTIVE_CORPUS:-default}
      MEETINGAGENT_BIND_HOST: ${MEETINGAGENT_BIND_HOST:-127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MEETINGAGENT_BIND_HOST:-127.0.0.1}:${MEETINGAGENT_API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./meetings:/app/meetings
      - ./vector_db:/app/vector_db
      - ./watched_folder:/app/watched_folder
      - ./config.docker.yaml:/app/config.docker.yaml:ro
    command: ["python", "scripts/asu_june_bot_api.py", "--host", "0.0.0.0", "--port", "8000"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  bot:
    image: meetingagent:local
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      MEETING_AGENT_CONFIG_PATH: /app/config.docker.yaml
      ASU_JUNE_BOT_CHAT_API_URL: http://api:8000/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./meetings:/app/meetings
      - ./vector_db:/app/vector_db
      - ./watched_folder:/app/watched_folder
      - ./config.docker.yaml:/app/config.docker.yaml:ro
    command: ["python", "scripts/asu_june_bot_telegram.py"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    profiles:
      - bot

  diarization:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DIARIZATION: "true"
    image: meetingagent:diarization
    env_file:
      - path: .env
        required: false
    environment:
      MEETING_AGENT_CONFIG_PATH: /app/config.docker.yaml
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./meetings:/app/meetings
      - ./models:/app/models:ro
      - ./config.docker.yaml:/app/config.docker.yaml:ro
      - "${MEETINGAGENT_RECORDINGS_DIR:-./watched_folder}:/host/recordings:ro"
    profiles:
      - diarization
    command: ["python", "scripts/23_diarize_meeting.py", "--help"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  diart:
    build:
      context: .
      dockerfile: Dockerfile.diart
    image: meetingagent:diart-pilot
    environment:
      HF_HOME: /cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      MPLCONFIGDIR: /cache/matplotlib
      PYANNOTE_CACHE: /cache/pyannote
      TORCH_HOME: /cache/torch
      XDG_CACHE_HOME: /cache/xdg
    volumes:
      - ./data/diart_cache:/cache
      - ./data/diart_output:/output
      - "${MEETINGAGENT_DIART_INPUT_DIR:-./watched_folder}:/input:ro"
    profiles:
      - diart
    command: ["--json"]
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp

  diart-api:
    build:
      context: .
      dockerfile: Dockerfile.diart
    image: meetingagent:diart-pilot
    entrypoint: ["python3", "scripts/51_diart_service.py"]
    environment:
      HF_HOME: /cache/huggingface
      HF_TOKEN: "${HF_TOKEN:-}"
      MPLCONFIGDIR: /cache/matplotlib
      PYANNOTE_CACHE: /cache/pyannote
      TORCH_HOME: /cache/torch
      XDG_CACHE_HOME: /cache/xdg
    volumes:
      - ./data/diart_cache:/cache
      - ./meetings:/meetings:ro
    ports:
      - "127.0.0.1:8765:8765"
    profiles:
      - diart-live
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
