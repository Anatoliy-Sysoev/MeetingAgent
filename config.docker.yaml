project_root: /app/watched_folder
work_root: /app

security:
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"
    - api

ollama:
  base_url: http://host.docker.internal:11434
  chat_base_url: http://host.docker.internal:11434/v1
  embedding_model: bge-m3
  chat_model: qwen3.5:4b
  embedding_num_ctx: 8192
  keep_alive: 24h
  num_parallel: 1

transcription:
  model: large-v3-turbo
  language: ru
  compute_type: int8
  device: cpu
  beam_size: 5
  vad_filter: true

meetings:
  max_upload_bytes: 2147483648
  max_text_artifact_bytes: 10485760
