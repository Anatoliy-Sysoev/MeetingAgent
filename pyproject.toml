[project]
name = "meetingagent"
version = "0.1.0"
description = "Local-first meeting intelligence and project memory tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anatoliy Sysoev" }
]
dependencies = [
  "argon2-cffi>=25.1,<26",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "lxml>=5.3,<7",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.10,<8",
  "pip-audit>=2.9,<3",
  "pip-tools>=7.5,<8",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1"
]
browser = [
  "playwright>=1.61,<2"
]
transcription = [
  "faster-whisper>=1.1,<2"
]
diarization = [
  "sherpa-onnx>=1.13.2,<2",
  "onnxruntime>=1.17,<2",
  "soundfile>=0.12.1,<1",
  "numpy>=1.26,<3"
]
live = [
  "vosk>=0.3.45,<0.4",
  "sounddevice>=0.4.6,<0.5",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
  "soxr>=1.0,<2",
  "silero-vad>=6.0.0,<7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"meeting_agent.api" = [
  "ui/templates/*.html",
  "ui/assets/v1/*.css",
  "ui/assets/v1/*.js"
]

[tool.ruff]
line-length = 100
target-version = "py311"
