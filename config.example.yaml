# Authentication settings.
auth:
  # Bootstrap safety for self-hosted / non-local deployments.
  # By default, POST /admin/bootstrap accepts only a direct loopback peer with
  # a localhost/loopback Host header. Foreign Host headers never get bypass.
  # To allow bootstrap from a non-local address, set allow_remote: true AND
  # provide a strong secret. The secret must be sent in the X-Bootstrap-Token
  # header. Both settings can also be set via environment variables
  # (MEETINGAGENT_BOOTSTRAP_ALLOW_REMOTE and MEETINGAGENT_BOOTSTRAP_SECRET),
  # which take precedence. Remove or disable both after bootstrap is complete.
  #
  # bootstrap:
  #   allow_remote: false        # default; set true only for non-local bootstrap
  #   secret: ""                 # required when allow_remote is true

  # Server-side session lifetime in seconds. Default: 86400 (24 h).
  session_ttl_seconds: 86400

  # Name of the HttpOnly session cookie. Default: ma_session.
  cookie_name: "ma_session"

  # Whether to set the Secure flag on session cookies.
  #   auto  — set Secure only when the request arrives over HTTPS (default, recommended)
  #   true  — always set Secure (use when behind a TLS-terminating reverse proxy)
  #   false — never set Secure (development only, not safe for production)
  cookie_secure: "auto"

  login_throttle:
    enabled: true            # set false to disable throttling (NoOp limiter)
    max_failures: 5          # failures (per email+IP) before blocking; the
                             # attempt that reaches this count gets 429 itself
    window_seconds: 300      # rolling window over which failures are counted
    block_seconds: 900       # block duration once the threshold is reached
    max_entries: 10000       # bounded in-memory state; LRU + stale eviction
    # X-Forwarded-For is only honored when the direct peer is one of these
    # CIDRs; the real client IP is then resolved right-to-left, skipping
    # trusted hops. Leave empty (default) to always use the direct peer IP
    # and ignore X-Forwarded-For — safe default for a directly-exposed host.
    trusted_proxy_cidrs: []

# Read-only Meeting API limits.
meetings:
  # Maximum uploaded media size in bytes. The API rejects larger files with
  # 413 and deletes partial temporary data. Default: 2 GiB.
  max_upload_bytes: 2147483648
  # Maximum size (in bytes, not characters) of a transcript or text artifact
  # the API will read into memory. Files above this limit are rejected before
  # any decode/JSON parse and the endpoint returns 413 Payload Too Large.
  # Protects the API process from unbounded memory use. Default: 10 MiB.
  max_text_artifact_bytes: 10485760
