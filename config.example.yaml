project_root: "%USERPROFILE%/Desktop/PROJECT_DOCUMENTS"
work_root: "%USERPROFILE%/Desktop/AI/MeetingAgent"

security:
  # Host header allowlist. Local defaults are always included.
  # Add the real DNS name before exposing the API through a reverse proxy.
  allowed_hosts:
    - localhost
    - 127.0.0.1
    - "::1"

ollama:
  base_url: "http://localhost:11434"
  embedding_model: "bge-m3"
  chat_model: "qwen3.5:4b"
  embedding_num_ctx: 8192
  keep_alive: "24h"

rag:
  search_backend: "numpy"
  chunk_size_chars: 3000
  chunk_overlap_chars: 300
  # Быстрый CPU-профиль Project Knowledge Bot search/chat runtime.
  top_k: 4
  score_threshold: 0.35
  min_sources: 1
  max_context_chars: 6000

generation:
  temperature: 0.1
  top_p: 0.8
  num_predict: 1400
  timeout_sec: 180

transcription:
  model: "large-v3-turbo"
  language: "ru"
  compute_type: "int8"
  device: "cpu"
  beam_size: 5
  vad_filter: true

paths:
  manifest: "data/manifest.jsonl"
  extracted_text_dir: "data/extracted_text"
  chunks: "data/chunks.jsonl"
  embeddings_cache: "data/embeddings_cache.jsonl"
  numpy_index: "data/numpy_index"
  # Лог реальных запросов для цикла разметки и коррекции. Локальный runtime, не коммитится.
  query_log: "data/query_log.jsonl"
  # Устаревшая папка ChromaDB. Основной поиск и сборка RAG ее не используют.
  vector_db: "vector_db"
  logs: "logs"
  watched_folder: "watched_folder"
  # SQLite database for auth (users, sessions, audit log). Local runtime, never commit.
  auth_db: "data/meetingagent/auth.db"
  # Durable pipeline state and bounded recovery history. Local runtime, never commit.
  jobs_state: "logs/jobs_state.json"
  # Durable bounded live-session state. Partial hypotheses remain memory-only.
  live_sessions_state: "logs/live_sessions_state.json"
  # Cross-process advisory lock for live/offline work on the same meeting.
  meeting_work_lock: "logs/meeting_work.lock"

live:
  # Optional local Vosk runtime. The API boots without the optional packages,
  # but preflight stays unavailable until the model and capture backend exist.
  model_path: "models/vosk/vosk-model-small-ru-0.22"
  vad: "silero"
  sample_rate: 16000
  block_ms: 300
  mic_queue_max_blocks: 32
  partials_max: 1000
  events_max: 500
  sessions_max: 50
  active_sessions_max: 2
  max_state_bytes: 4194304
  stop_timeout_seconds: 15
  # Source-scoped PCM16 WAV archive used by canonical offline refinement.
  audio_archive_max_bytes: 2000000000
  audio_archive_min_free_bytes: 268435456
  # Optional preliminary SYS speaker labels via the localhost Diart sidecar.
  # Offline sherpa diarization remains canonical.
  diarization:
    enabled: false
    base_url: "http://127.0.0.1:8765"
    timeout_seconds: 900

